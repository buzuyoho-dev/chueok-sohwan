name: 매일 인스타 게시
on:
  schedule:
    # 매일 20:30 KST 안팎. GitHub 예약 실행은 늦거나 빠질 수 있어 여러 번 걸어 둔다.
    # 이미 올린 날은 queue에 폴더가 없어 그냥 넘어가고, 20~24시 KST 밖이면 건너뛴다.
    - cron: "23 11 * * *"   # 20:23 KST
    - cron: "41 11 * * *"   # 20:41 KST
    - cron: "07 12 * * *"   # 21:07 KST
    - cron: "37 12 * * *"   # 21:37 KST
    - cron: "17 13 * * *"   # 22:17 KST
  workflow_dispatch:
    inputs:
      post_date: { description: "올릴 날짜 YYYY-MM-DD (비우면 오늘)", required: false }
      dry_run: { description: "1이면 실제로 올리지 않고 확인만", required: false }
permissions:
  contents: write
concurrency: publish
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 게시
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          POST_DATE: ${{ inputs.post_date }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: python3 scripts/publish.py
      - name: 게시 기록 저장
        run: |
          git config user.name "autopost-bot"
          git config user.email "autopost-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "게시 완료 기록" && git pull --rebase && git push)
