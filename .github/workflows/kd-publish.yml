name: korea-decoded-publish
on:
  schedule:
    # 월~금 22:10 KST(미국 동부 아침). 예약이 밀리거나 빠질 때를 대비해 여러 번 시도,
    # 스크립트가 하루 1편·21:00~05:59 KST만 게시한다.
    - cron: "10 13 * * 1-5"
    - cron: "40 14 * * 1-5"
    - cron: "10 16 * * 1-5"
  workflow_dispatch:
    inputs:
      day:
        description: "게시할 날짜 폴더 (비우면 오늘 KST)"
        required: false
permissions:
  contents: write
concurrency: kd-publish
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 품질 검사 후 게시
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: python3 scripts/kd_publish.py ${{ github.event.inputs.day }}
      - name: 게시 기록 저장
        run: |
          git config user.name "korea-decoded-bot"
          git config user.email "actions@users.noreply.github.com"
          git add korea-decoded
          git diff --cached --quiet || (git commit -m "Korea Decoded 게시 기록" && git pull --rebase origin main && git push)
