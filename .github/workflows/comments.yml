name: 댓글 관리
on:
  workflow_dispatch:
    inputs:
      mode: { description: "fetch(댓글 가져오기) 또는 reply(답글 달기)", required: true, default: fetch }
permissions:
  contents: write
concurrency: comments
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 실행
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          MODE: ${{ inputs.mode }}
        run: python3 scripts/comments.py
      - name: 기록 저장
        if: always()
        run: |
          git config user.name "autopost-bot"
          git config user.email "autopost-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "댓글 ${{ inputs.mode }} 기록" && git pull --rebase && git push)
